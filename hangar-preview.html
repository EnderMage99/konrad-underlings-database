<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hangar preview</title>
<style>
  :root {
    --ground: #05090E; --ground-2: #0A1520; --surface: #0B1822; --ink: #D2ECF6; --ink-soft: #90B6C8; --ink-faint: #5B7F92;
    --rule: #1B3E4E; --accent: #3FD8F0; --accent-dim: #1E7E96; --alert: #F2555A;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font-family: var(--body); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  .bar { position: fixed; left: 1rem; top: 1rem; right: 1rem; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; z-index: 2; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  h1 { margin: 0 .8rem 0 0; font-size: 1.1rem; font-weight: 600; }
  .btn { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; padding: .45rem .7rem; background: var(--surface); color: var(--ink-soft); border: 1px solid var(--rule); cursor: pointer; }
  .btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .sep { width: 1px; height: 1.4rem; background: var(--rule); margin: 0 .3rem; }
  label.sl { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); display: inline-flex; align-items: center; gap: .4rem; background: var(--surface); border: 1px solid var(--rule); padding: .3rem .6rem; }
  .note { position: fixed; left: 1rem; bottom: 1rem; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); line-height: 1.8; z-index: 2; }
  .gate { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 2rem; z-index: 5; background: var(--ground); }
  .gate p { max-width: 30rem; color: var(--ink-soft); line-height: 1.6; }
  .gate a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="gate" id="gate"><p id="gatemsg">Checking clearance...</p></div>
<canvas id="c"></canvas>
<div class="bar" id="bar" hidden>
  <h1>Hangar preview</h1>
  <span id="models"></span>
  <span class="sep"></span>
  <button class="btn" id="b-paint" aria-pressed="true" type="button">Paint</button>
  <button class="btn" id="b-lights" aria-pressed="true" type="button">Lights</button>
  <button class="btn" id="b-shadow" aria-pressed="false" type="button">In shadow</button>
  <button class="btn" id="b-spin" aria-pressed="true" type="button">Spin</button>
  <label class="sl">Sun <input type="range" id="sun" min="0" max="360" value="40"></label>
  <label class="sl">Distance <input type="range" id="far" min="0" max="100" value="0"></label>
</div>
<div class="note" id="note" hidden></div>
<script>
(function () {
  "use strict";

  // ==== MODEL PAINT AND LIGHT ==============================================
  // Shared with the star chart once approved. A mesh is { v, f } with f
  // rows [a, b, c, material]. paintMesh() rewrites the material of every
  // triangle to an index into a palette it builds: hull tones in panels,
  // darker recesses, accent bands, and lights. drawMesh() shades it.

  function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }
  function hash3(a, b, c) { return hash((a * 73856093) ^ (b * 19349663) ^ (c * 83492791)); }

  // Palette entries: { rgb, emit, anim, seed }. anim: 0 steady, 1 slow pulse,
  // 2 flicker, 3 mostly dead with rare flicker.
  function paintMesh(m, st) {
    var V = m.v, F = m.f, n = F.length;
    var ax = st.axis, o1 = (ax + 1) % 3, o2 = (ax + 2) % 3;
    var lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
    V.forEach(function (v) { for (var k = 0; k < 3; k++) { if (v[k] < lo[k]) lo[k] = v[k]; if (v[k] > hi[k]) hi[k] = v[k]; } });
    var span = hi[ax] - lo[ax] || 1;
    var T = new Float32Array(n), R = new Float32Array(n), A = new Float32Array(n), ANG = new Float32Array(n), NA = new Float32Array(n), DOM = new Uint8Array(n);
    var BINS = 48, maxR = new Float32Array(BINS), gmax = 0, areas = [];
    for (var i = 0; i < n; i++) {
      var a = V[F[i][0]], b = V[F[i][1]], c = V[F[i][2]];
      var cx = (a[0] + b[0] + c[0]) / 3, cy = (a[1] + b[1] + c[1]) / 3, cz = (a[2] + b[2] + c[2]) / 3, cen = [cx, cy, cz];
      var ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx, l = Math.hypot(nx, ny, nz) || 1e-9;
      var nn = [nx / l, ny / l, nz / l];
      A[i] = l / 2; areas.push(l / 2);
      T[i] = (cen[ax] - lo[ax]) / span;
      R[i] = Math.hypot(cen[o1], cen[o2]);
      ANG[i] = Math.atan2(cen[o2], cen[o1]);
      NA[i] = nn[ax];
      var d = 0; if (Math.abs(nn[1]) > Math.abs(nn[d])) d = 1; if (Math.abs(nn[2]) > Math.abs(nn[d])) d = 2;
      DOM[i] = d * 2 + (nn[d] < 0 ? 1 : 0);
      var bin = Math.min(BINS - 1, Math.floor(T[i] * BINS));
      if (R[i] > maxR[bin]) maxR[bin] = R[i];
      if (R[i] > gmax) gmax = R[i];
    }
    areas.sort(function (x, y) { return x - y; });
    var small = areas[Math.floor(n * (st.windowSize || 0.35))];

    var pal = [], ix = {};
    function col(key, rgb, emit, anim, seed) { if (ix[key] === undefined) { ix[key] = pal.length; pal.push({ rgb: rgb, emit: emit || 0, anim: anim || 0, seed: seed || 0 }); } return ix[key]; }
    st.hull.forEach(function (h, k) { col("h" + k, h); });
    col("recess", st.recess);
    col("accent", st.accent);

    for (i = 0; i < n; i++) {
      var bin2 = Math.min(BINS - 1, Math.floor(T[i] * BINS));
      var rel = st.ring ? R[i] / gmax : R[i] / (maxR[bin2] || 1);
      var band = Math.floor(T[i] * st.bands), sector = Math.floor((ANG[i] + Math.PI) / (2 * Math.PI) * st.sectors);
      var panel = hash3(band, sector, DOM[i]);
      var mat = ix["h" + Math.floor(panel * st.hull.length)];
      if (!st.ring && rel < st.recessBelow) mat = ix.recess;
      if (st.ring && Math.abs(NA[i]) < 0.35 && panel < 0.35) mat = ix.recess;
      // accent bands on the outer skin
      (st.stripes || []).forEach(function (s) {
        var p = st.ring ? rel : T[i];
        if (p >= s[0] && p <= s[1] && (st.ring ? Math.abs(NA[i]) > 0.5 : rel > 0.72)) mat = ix.accent;
      });
      // windows: small outer faces, lit by the panel so they come in rows
      if (st.windows && A[i] <= small && (st.ring ? true : rel > 0.6)) {
        var w = hash3(band * 7 + 3, sector * 5 + 1, i >> 1);
        if (w < st.windows.p) {
          var kind = Math.floor(hash(i * 31 + 7) * st.windows.colors.length);
          var seed = Math.floor(hash(band * 13 + sector) * 5);
          mat = col("w" + kind + "_" + seed, st.windows.colors[kind], 1, st.windows.anim, seed);
        }
      }
      // engines: faces at the stern looking aft
      if (st.engine && T[i] < st.engine.at && NA[i] < -0.55) mat = col("eng", st.engine.color, 1, 1, 9);
      // a lit core: the inner ring of a gate
      if (st.core && R[i] / gmax >= st.core.from && R[i] / gmax <= st.core.to && Math.abs(NA[i]) < st.core.facing) mat = col("core", st.core.color, 1, 1, 3);
      F[i][3] = mat;
    }
    m.pal = pal;
    return m;
  }

  // How bright a light is right now.
  function glowOf(p, t, on) {
    if (!on) return 0.06;
    if (p.anim === 1) return 0.72 + 0.28 * Math.sin(t * 1.1 + p.seed);
    if (p.anim === 2) { var f = hash(Math.floor(t * 9) * 131 + p.seed * 17); return f < 0.18 ? 0.15 : 0.75 + 0.25 * f; }
    if (p.anim === 3) { var g = hash(Math.floor(t * 6) * 97 + p.seed * 29), slow = hash(Math.floor(t / 2.5) * 53 + p.seed * 7); return slow < 0.45 ? 0.04 : (g < 0.5 ? 0.1 : 0.9); }
    return 1;
  }

  // Draws a painted mesh. view = { x, y, scale, rot } where rot is a 3x3
  // (rows: screen right, screen up, toward viewer); light is a unit vector
  // in model space toward the sun. opts: sun (0..1 strength), bounce
  // { dir, rgb } light off a nearby world, lights (on/off), paint, time.
  var GLOW = document.createElement("canvas"), GLOWX = GLOW.getContext("2d");
  var canBlur = typeof GLOWX.filter === "string";
  function drawMesh(ctx, m, view, light, opts) {
    var V = m.v, F = m.f, pal = m.pal, rot = view.rot, s = view.scale;
    if (!m._n) {
      m._n = new Float32Array(F.length * 3);
      for (var i = 0; i < F.length; i++) {
        var a = V[F[i][0]], b = V[F[i][1]], c = V[F[i][2]];
        var ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
        var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx, l = Math.hypot(nx, ny, nz) || 1;
        m._n[i * 3] = nx / l; m._n[i * 3 + 1] = ny / l; m._n[i * 3 + 2] = nz / l;
      }
    }
    var N = m._n, P = m._p || (m._p = new Float32Array(V.length * 3));
    for (var k = 0; k < V.length; k++) {
      var v = V[k];
      P[k * 3] = view.x + (v[0] * rot[0] + v[1] * rot[1] + v[2] * rot[2]) * s;
      P[k * 3 + 1] = view.y - (v[0] * rot[3] + v[1] * rot[4] + v[2] * rot[5]) * s;
      P[k * 3 + 2] = v[0] * rot[6] + v[1] * rot[7] + v[2] * rot[8];
    }
    var order = m._o || (m._o = new Uint32Array(F.length)), depth = m._d || (m._d = new Float32Array(F.length));
    for (var t = 0; t < F.length; t++) { order[t] = t; depth[t] = P[F[t][0] * 3 + 2] + P[F[t][1] * 3 + 2] + P[F[t][2] * 3 + 2]; }
    Array.prototype.sort.call(order, function (p, q) { return depth[p] - depth[q]; });
    var sun = opts.sun, amb = 0.09, bo = opts.bounce, glows = [];
    var gl = pal.map(function (p) { return p.emit ? glowOf(p, opts.time, opts.lights) : 0; });
    for (var j = 0; j < order.length; j++) {
      var ti = order[j], f = F[ti], p = opts.paint ? pal[f[3]] : null;
      var n0 = N[ti * 3], n1 = N[ti * 3 + 1], n2 = N[ti * 3 + 2];
      var r, g, bl;
      if (p && p.emit) {
        var e = gl[f[3]];
        r = p.rgb[0] * e; g = p.rgb[1] * e; bl = p.rgb[2] * e;
        if (e > 0.3) glows.push(ti);
      } else {
        var base = p ? p.rgb : [0.62, 0.66, 0.70];
        // two-sided diffuse: the winding of these models is not reliable
        var d = Math.abs(n0 * light[0] + n1 * light[1] + n2 * light[2]);
        var lit = amb + (1 - amb) * d * sun;
        r = base[0] * lit; g = base[1] * lit; bl = base[2] * lit;
        if (bo) {
          var bd = Math.max(0, n0 * bo.dir[0] + n1 * bo.dir[1] + n2 * bo.dir[2]) * 0.22;
          r += base[0] * bo.rgb[0] * bd; g += base[1] * bo.rgb[1] * bd; bl += base[2] * bo.rgb[2] * bd;
        }
      }
      ctx.fillStyle = "rgb(" + (Math.min(255, r * 255) | 0) + "," + (Math.min(255, g * 255) | 0) + "," + (Math.min(255, bl * 255) | 0) + ")";
      ctx.beginPath();
      ctx.moveTo(P[f[0] * 3], P[f[0] * 3 + 1]); ctx.lineTo(P[f[1] * 3], P[f[1] * 3 + 1]); ctx.lineTo(P[f[2] * 3], P[f[2] * 3 + 1]);
      ctx.closePath(); ctx.fill();
    }
    // the lights bleed: redrawn blurred and added on top
    if (glows.length && opts.paint && canBlur) {
      var pad = Math.ceil(s * 0.06) + 8, w = Math.ceil(s * 1.2) + pad * 2;
      if (GLOW.width !== w) { GLOW.width = w; GLOW.height = w; }
      GLOWX.setTransform(1, 0, 0, 1, 0, 0); GLOWX.clearRect(0, 0, w, w);
      var ox = w / 2 - view.x, oy = w / 2 - view.y;
      glows.forEach(function (ti) {
        var f = F[ti], p = pal[f[3]], e = gl[f[3]];
        GLOWX.fillStyle = "rgb(" + (p.rgb[0] * 255 * e | 0) + "," + (p.rgb[1] * 255 * e | 0) + "," + (p.rgb[2] * 255 * e | 0) + ")";
        GLOWX.beginPath();
        GLOWX.moveTo(P[f[0] * 3] + ox, P[f[0] * 3 + 1] + oy); GLOWX.lineTo(P[f[1] * 3] + ox, P[f[1] * 3 + 1] + oy); GLOWX.lineTo(P[f[2] * 3] + ox, P[f[2] * 3 + 1] + oy);
        GLOWX.closePath(); GLOWX.fill();
      });
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.filter = "blur(" + Math.max(2, s * 0.012).toFixed(1) + "px)";
      ctx.drawImage(GLOW, -ox, -oy);
      ctx.drawImage(GLOW, -ox, -oy);
      ctx.restore();
    }
  }

  // The look of each body.
  var STYLES = {
    aliakmon: { axis: 1, bands: 26, sectors: 8, recessBelow: 0.28,
      hull: [[0.50, 0.56, 0.63], [0.44, 0.50, 0.58], [0.56, 0.62, 0.68], [0.38, 0.44, 0.52]],
      recess: [0.22, 0.26, 0.32], accent: [0.25, 0.85, 0.94],
      stripes: [[0.62, 0.65], [0.30, 0.315]],
      windows: { p: 0.3, colors: [[1.0, 0.86, 0.60], [1.0, 0.93, 0.78]], anim: 0 }, windowSize: 0.4,
      engine: { at: 0.035, color: [0.45, 0.85, 1.0] } },
    derelict: { axis: 2, bands: 22, sectors: 10, recessBelow: 0.22,
      hull: [[0.60, 0.60, 0.56], [0.50, 0.51, 0.49], [0.68, 0.66, 0.61], [0.42, 0.43, 0.43]],
      recess: [0.20, 0.21, 0.21], accent: [0.52, 0.30, 0.18],
      stripes: [[0.48, 0.5]],
      windows: { p: 0.14, colors: [[0.55, 0.97, 0.65], [0.71, 0.55, 1.0]], anim: 3 }, windowSize: 0.4 },
    gate: { axis: 0, ring: true, bands: 6, sectors: 24,
      hull: [[0.30, 0.33, 0.38], [0.24, 0.27, 0.32], [0.36, 0.39, 0.44], [0.20, 0.22, 0.27]],
      recess: [0.09, 0.10, 0.13], accent: [0.62, 0.50, 0.24],
      stripes: [[0.93, 1.0]],
      windows: { p: 0.08, colors: [[0.25, 0.85, 0.94], [1.0, 0.80, 0.45]], anim: 0 }, windowSize: 0.3,
      core: { from: 0.0, to: 0.24, facing: 0.6, color: [0.16, 0.55, 0.62] } }
  };
  // ==== END MODEL PAINT AND LIGHT ==========================================

  var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);
  function resize() { W = innerWidth; H = innerHeight; canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  addEventListener("resize", resize); resize();

  var MESH = {}, NAMES = { aliakmon: "Aliakmon", derelict: "Derelict Station", gate: "Warp Gate" };
  var state = { model: "aliakmon", yaw: -0.7, pitch: 0.35, zoom: 1, paint: true, lights: true, shadow: false, spin: true };
  var BOUNCE = { aliakmon: [0.85, 0.72, 0.45], derelict: null, gate: null };

  function rotFor(yaw, pitch) {
    var cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    // model z is up; yaw turns about z, pitch tips the view down
    return [cy, -sy, 0,
            sy * sp, cy * sp, cp,
            sy * cp, cy * cp, -sp];
  }
  var t0 = performance.now(), last = t0, ms = 0;
  function frame(now) {
    var dt = (now - last) / 1000; last = now;
    if (state.spin && !drag) state.yaw += dt * 0.25;
    ctx.clearRect(0, 0, W, H);
    var bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    bg.addColorStop(0, "#0A1520"); bg.addColorStop(1, "#05090E");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    var m = MESH[state.model];
    if (m) {
      var sunA = document.getElementById("sun").value * Math.PI / 180, far = document.getElementById("far").value / 100;
      var light = [Math.cos(sunA) * 0.92, Math.sin(sunA) * 0.92, 0.38];
      var a = performance.now();
      drawMesh(ctx, m, { x: W / 2, y: H / 2 + 10, scale: Math.min(W, H) * 0.72 * state.zoom, rot: rotFor(state.yaw, state.pitch) }, light, {
        sun: state.shadow ? 0.03 : 1 - far * 0.6, lights: state.lights, paint: state.paint, time: (now - t0) / 1000,
        bounce: BOUNCE[state.model] && !state.shadow ? { dir: [0, 0, -1], rgb: BOUNCE[state.model] } : null });
      ms = ms * 0.9 + (performance.now() - a) * 0.1;
      document.getElementById("note").textContent = NAMES[state.model] + " · " + m.f.length + " triangles · " + m.pal.length + " paints · " + ms.toFixed(1) + " ms a frame · drag to turn, wheel to zoom";
    }
    requestAnimationFrame(frame);
  }

  var drag = null;
  canvas.addEventListener("pointerdown", function (e) { drag = { x: e.clientX, y: e.clientY, yaw: state.yaw, pitch: state.pitch }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", function (e) { if (!drag) return; state.yaw = drag.yaw + (e.clientX - drag.x) * 0.008; state.pitch = Math.max(-1.5, Math.min(1.5, drag.pitch + (e.clientY - drag.y) * 0.006)); });
  canvas.addEventListener("pointerup", function () { drag = null; });
  canvas.addEventListener("wheel", function (e) { e.preventDefault(); state.zoom = Math.max(0.3, Math.min(6, state.zoom * (e.deltaY > 0 ? 0.92 : 1.08))); }, { passive: false });

  function toggle(id, key) {
    var b = document.getElementById(id);
    b.addEventListener("click", function () { state[key] = !state[key]; b.setAttribute("aria-pressed", String(state[key])); });
  }
  toggle("b-paint", "paint"); toggle("b-lights", "lights"); toggle("b-shadow", "shadow"); toggle("b-spin", "spin");

  function start(meshes) {
    // the chart turns the gate a quarter so its face looks at the star
    meshes.gate.v.forEach(function (v) { var t = v[0]; v[0] = v[1]; v[1] = -t; });
    Object.keys(meshes).forEach(function (k) { MESH[k] = paintMesh(meshes[k], STYLES[k]); });
    var box = document.getElementById("models");
    Object.keys(NAMES).forEach(function (k) {
      var b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = NAMES[k];
      b.setAttribute("aria-pressed", String(k === state.model));
      b.addEventListener("click", function () {
        state.model = k;
        Array.prototype.forEach.call(box.children, function (c) { c.setAttribute("aria-pressed", String(c === b)); });
      });
      box.appendChild(b); box.appendChild(document.createTextNode(" "));
    });
    var q = (location.search.match(/[?&]model=([a-z]+)/) || [])[1];
    if (q && MESH[q]) { state.model = q; Array.prototype.forEach.call(box.children, function (c) { if (c.setAttribute) c.setAttribute("aria-pressed", String(c.textContent === NAMES[q])); }); }
    document.getElementById("gate").hidden = true;
    document.getElementById("bar").hidden = false;
    document.getElementById("note").hidden = false;
    window.__hangar = { state: state, frame: frame, MESH: MESH };
    requestAnimationFrame(frame);
  }

  // The models are read out of the star chart itself, so this page always
  // shows the meshes the chart is using.
  async function loadMeshes() {
    if (window.__MESHES) return window.__MESHES;
    var txt = await (await fetch("starmap.html", { cache: "no-store" })).text();
    function grab(name) {
      var m = txt.match(new RegExp("var " + name + " = (\\{.*?\\});\\n"));
      if (!m) throw new Error("The chart has no " + name + ".");
      return JSON.parse(m[1]);
    }
    return { aliakmon: grab("SHIP_MESH"), derelict: grab("STATION_MESH"), gate: grab("GATE_MESH") };
  }

  // Archivist only. The check is made against the archive with the session
  // the main site keeps; anyone else is turned away before a model loads.
  var SB_URL = "https://pbvfrdmpieniedgxpogb.supabase.co", SB_KEY = "sb_publishable_dfQX7xZJSfR5xLPUWda2Cg_tzwXfxuC", SB_STORE = "overseer.session";
  async function isArchivist() {
    if (window.__MESHES) return true;   // local test harness
    var session = null;
    try { session = JSON.parse(localStorage.getItem(SB_STORE) || "null"); } catch (e) {}
    if (!session) return false;
    async function call(path, opts) {
      opts = opts || {};
      var res = await fetch(SB_URL + path, { method: opts.method || "GET",
        headers: { apikey: SB_KEY, "Content-Type": "application/json", Authorization: "Bearer " + (opts.token || SB_KEY) },
        body: opts.body ? JSON.stringify(opts.body) : undefined });
      if (!res.ok) throw new Error("refused");
      return res.json();
    }
    if (session.expires_at && session.expires_at * 1000 < Date.now() + 30000) {
      // refresh tokens rotate, so the new pair must be written back for the archive to keep working
      var r = await call("/auth/v1/token?grant_type=refresh_token", { method: "POST", body: { refresh_token: session.refresh_token } });
      session = { access_token: r.access_token, refresh_token: r.refresh_token, expires_at: r.expires_at, user_id: r.user.id };
      localStorage.setItem(SB_STORE, JSON.stringify(session));
    }
    var rows = await call("/rest/v1/profiles?select=is_moderator&id=eq." + session.user_id, { token: session.access_token });
    return !!(rows && rows[0] && rows[0].is_moderator);
  }

  (async function () {
    var msg = document.getElementById("gatemsg");
    try {
      if (!(await isArchivist())) {
        msg.innerHTML = "This page is for the archivist. <a href=\"./\">Sign in on the archive</a> as the archivist, then come back.";
        return;
      }
      msg.textContent = "Loading the models...";
      start(await loadMeshes());
    } catch (e) {
      msg.textContent = "Could not open the hangar: " + e.message;
    }
  })();
})();
</script>
