<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Chart</title>
<meta name="description" content="The systems the campaign has moved through, as a chart you can turn, with a file on every world the squad has set foot on.">
<style>
  /* Palette and type, copied from the index so this page can stand alone. */
  :root {
    --ground: #05090E; --ground-2: #0A1520; --surface: #0B1822; --surface-alt: #10242F; --plate: #04080C;
    --ink: #D2ECF6; --ink-soft: #90B6C8; --ink-faint: #5B7F92;
    --rule: #1B3E4E; --accent: #3FD8F0; --accent-dim: #1E7E96; --brass: #F5B33C; --moss: #45E0A0;
    --steel: #7FA6BE; --violet: #A78BFA; --alert: #F2555A;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --cut: 10px;
    --chamfer: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font-family: var(--body); overflow: hidden; }
  button { font: inherit; }

  /* ---------- the chart ---------- */
  #stars, #chart { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #chart { cursor: grab; touch-action: none; }
  #chart.grabbing { cursor: grabbing; }
  #chart.over { cursor: pointer; }

  .hud { position: fixed; z-index: 3; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .hud-title { left: 1.4rem; top: 1.2rem; }
  .kicker { font-family: var(--mono); font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--accent); }
  .hud-title h1 { margin: .15rem 0 0; font-size: 1.9rem; letter-spacing: .04em; text-shadow: 0 0 22px rgba(63,216,240,.35); }
  .hud-title .sys { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); margin-top: .35rem; }
  .hud-help { right: 1.4rem; top: 1.4rem; text-align: right; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); line-height: 1.8; }
  .hud-foot { left: 1.4rem; bottom: 1.2rem; display: flex; gap: .5rem; align-items: center; }
  .btn {
    font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    padding: .45rem .8rem; background: var(--surface); color: var(--ink-soft); border: 1px solid var(--rule); cursor: pointer;
  }
  .btn:hover, .btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent-dim); }
  .legend { display: flex; gap: .8rem; margin-left: .6rem; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: .35rem; }

  /* hover label on the chart */
  .tip { position: fixed; z-index: 4; pointer-events: none; transform: translate(-50%, calc(-100% - 14px)); display: none;
         font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
         background: rgba(11,24,34,.92); border: 1px solid var(--accent-dim); padding: .35rem .6rem; white-space: nowrap; }
  .tip.show { display: block; }
  .tip .sub { display: block; font-size: 9px; color: var(--ink-faint); margin-top: .15rem; }

  /* ---------- the planet view ---------- */
  /* The file is an overlay on the live chart: the rail and the panels take
     the pointer, the rest of the stage lets it through so the chart can
     still be dragged and its worlds clicked. */
  #pv { position: fixed; inset: 0; z-index: 10; display: grid; grid-template-columns: minmax(16rem, 22rem) 1fr; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
  #pv.on { opacity: 1; }
  #pv.on .rail, #pv.on .stage > .panel, #pv.on .stage > .chips, #pv.on .stage > .back, #pv.on .stage > h2 { pointer-events: auto; }
  .rail { background: rgba(5,9,14,.86); border-right: 1px solid var(--rule); padding: 1.6rem 1.4rem; overflow-y: auto; backdrop-filter: blur(6px); }
  .rail h2 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  .rail .lede { margin: .3rem 0 1.4rem; font-size: .8rem; color: var(--ink-faint); }
  .dest { display: grid; grid-template-columns: 4.2rem 1fr auto; align-items: center; gap: .9rem; width: 100%; text-align: left;
          background: none; border: 0; border-top: 1px solid rgba(27,62,78,.6); padding: .9rem 0; color: var(--ink); cursor: pointer; }
  .dest:last-child { border-bottom: 1px solid rgba(27,62,78,.6); }
  .dest canvas { width: 4.2rem; height: 4.2rem; display: block; }
  .dest .nm { font-size: 1rem; }
  .dest .dist { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-top: .2rem; }
  .dest .go { font-family: var(--mono); color: var(--accent); opacity: 0; transition: opacity .2s; }
  .dest:hover .go, .dest[aria-current="true"] .go { opacity: 1; }
  .dest[aria-current="true"] .nm { color: var(--accent); }
  .dest.locked { cursor: default; color: var(--ink-faint); }
  .dest.locked canvas { opacity: .35; filter: grayscale(1); }
  .dest.locked .nm::after { content: " \00b7 not yet visited"; font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
  .rail .back { margin-top: 1.4rem; }

  .stage { position: relative; overflow: hidden; }
  .stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 60% 45%, rgba(63,216,240,.06), transparent 55%); pointer-events: none; }
  .stage h2 { position: absolute; right: 2rem; top: 1.4rem; margin: 0; font-size: 2.4rem; font-weight: 500; letter-spacing: .02em; text-shadow: 0 0 22px rgba(63,216,240,.3); z-index: 2; }
  .stage .back { position: absolute; left: 1.4rem; top: 1.6rem; z-index: 3; }
  #marks { position: fixed; inset: 0; pointer-events: none; z-index: 12; }
  .mark { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 1.5px solid var(--ink);
          background: rgba(5,9,14,.35); box-shadow: inset 0 0 0 3px rgba(5,9,14,.5); cursor: pointer; transition: transform .2s, border-color .2s; pointer-events: auto; }
  .mark::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--ink); }
  .mark:hover, .mark.on { border-color: var(--accent); transform: scale(1.2); box-shadow: inset 0 0 0 3px rgba(5,9,14,.5), 0 0 14px rgba(63,216,240,.6); }
  .mark.on::after { background: var(--accent); }
  #lead { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 11; }
  #lead line { stroke: var(--ink); stroke-width: 1; opacity: .8; }

  /* callout panels */
  .panel { position: absolute; z-index: 2; background: rgba(11,24,34,.9); border: 1px solid var(--accent-dim); backdrop-filter: blur(4px);
           clip-path: var(--chamfer); }
  .panel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  .stats { right: 2rem; top: 5.6rem; display: flex; }
  .stats div { padding: .8rem 1.3rem; border-right: 1px solid var(--rule); }
  .stats div:last-child { border-right: 0; }
  .k { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); }
  .v { display: block; font-size: 1.05rem; margin-top: .15rem; }
  .lore { left: 2rem; bottom: 2rem; width: min(30rem, calc(100% - 4rem)); padding: 1rem 1.3rem 1.1rem; max-height: 55vh; overflow-y: auto; }
  .lore .k { color: var(--accent); }
  .lore h3 { margin: .2rem 0 .5rem; font-size: 1.3rem; font-weight: 500; }
  .lore p { margin: 0 0 .6rem; font-size: .88rem; line-height: 1.6; color: var(--ink-soft); }
  .lore p.ph { color: var(--ink-faint); font-style: italic; }
  /* mission conditions, set like a system on a dossier card */
  .cond { margin-top: .9rem; }
  .cond h4 {
    display: inline-block; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    margin: 0 0 .6rem; background: var(--accent-dim); color: #EAF8FF; padding: .12rem 1.1rem .12rem .5rem;
    clip-path: polygon(0 0, 100% 0, calc(100% - .6rem) 100%, 0 100%);
  }
  .cond ul { list-style: none; margin: 0; padding: 0; }
  .entry + .entry { margin-top: .7rem; }
  .entry .name { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
  .entry .txt { font-size: 13px; line-height: 1.5; color: var(--ink-soft); margin-top: .26rem; }
  .entry .meta { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-top: .2rem; }
  .status { white-space: nowrap; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; font-weight: 600; color: var(--ink); }
  .status.bad { color: var(--alert); text-decoration-color: var(--alert); }
  .status.heat { color: var(--brass); text-decoration-color: var(--brass); }
  .chips { position: absolute; right: 2rem; bottom: 2rem; display: flex; flex-wrap: wrap; gap: .4rem; justify-content: flex-end; max-width: 40%; z-index: 2; }
  .chip { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; padding: .45rem .7rem;
          background: rgba(11,24,34,.9); color: var(--ink-soft); border: 1px solid var(--rule); cursor: pointer; }
  .chip:hover { border-color: var(--accent-dim); color: var(--ink); }
  .chip[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .chip .kind { display: block; font-size: 8px; color: var(--ink-faint); letter-spacing: .12em; margin-top: .15rem; }
  .link { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-dim); }

  /* while a file is open the chart and its controls step aside; the
     starfield stays behind the world */
  body.pv-on .hud-title, body.pv-on .hud-help { visibility: hidden; }
  body.pv-on .hud-foot { left: auto; right: 2rem; bottom: auto; top: 10.2rem; }
  body.pv-on .legend { display: none; }

  @media (max-width: 760px) {
    #pv { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .rail { max-height: 34vh; padding: 1rem; }
    .stage h2 { font-size: 1.5rem; right: 1rem; top: 1rem; }
    .stats { position: static; margin: 3.6rem 1rem 0; flex-wrap: wrap; }
    .lore { left: 1rem; bottom: 1rem; width: calc(100% - 2rem); max-height: 40vh; }
    .chips { right: 1rem; bottom: auto; top: 50%; max-width: 45%; }
  }
  @media (prefers-reduced-motion: reduce) { #pv, .mark, .dest .go { transition: none; } }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<canvas id="chart"></canvas>

<div class="hud hud-title">
  <div class="kicker">Overseer &mdash; navigation</div>
  <h1>Star Chart</h1>
  <div class="sys" id="sysname"></div>
</div>
<div class="hud hud-help">drag to turn &middot; wheel to zoom<br>click a world for its file</div>
<div class="hud hud-foot">
  <button class="btn" id="drift" type="button" aria-pressed="true">Orbits: moving</button>
  <button class="btn" id="reset" type="button">Reset view</button>
  <div class="legend"><span><i style="background:#45E0A0"></i>visited</span><span><i style="background:#2A3D48"></i>not yet</span></div>
</div>
<div class="tip" id="tip"></div>

<div id="pv" aria-hidden="true">
  <aside class="rail">
    <h2>Available destinations</h2>
    <p class="lede">Select a world to open its file. Greyed worlds have not been visited.</p>
    <div id="dests"></div>
    <button class="btn back" id="back" type="button">&larr; Back to the chart</button>
  </aside>
  <section class="stage">
    <h2 id="pvname"></h2>
    <div id="marks"></div>
    <svg id="lead"><line id="leadline" x1="0" y1="0" x2="0" y2="0"></line></svg>
    <div class="panel stats" id="pvstats"></div>
    <div class="panel lore" id="pvlore"></div>
    <div class="chips" id="pvchips"></div>
  </section>
</div>

<script>
(function () {
  // ---- data ----------------------------------------------------------------
  // One entry per system. A planet's orbit is in chart units, its period a
  // multiple of the innermost world's year. Only visited worlds carry a
  // palette, stats and regions; the rest render as dim silhouettes and are
  // not selectable. Region text marked placeholder is waiting on the GM.
  var PH = "[Placeholder - lore to be written.]";
  var SYSTEMS = [
    {
      id: "invideis", name: "Invideis", star: { color: "#FFF4D6", glow: "#F5B33C", size: 22 },
      planets: [
        { id: "i",   name: "Invideis-I",   orbit: 55,  period: 1.0,  size: 4.5, visited: false, phase: 0.8 },
        { id: "ii",  name: "Invideis-II",  orbit: 125, period: 3.4,  size: 8,   visited: true,  phase: 3.9,
          ring: "#45E0A0",
          palette: { sea: "#1B4F7A", land: ["#2E8B57", "#3C9D62", "#C2A56B", "#8C8F93", "#6B7F8E"], cloud: "rgba(255,255,255,.18)" },
          dist: "0.00 ly - here",
          stats: [["Biomes", "Woods, mountains, desert"], ["Principal city", "Vintatem"], ["Field of operations", "Dictis"], ["Contract", "Active"]],
          regions: [
            { id: "woods", name: "Woods", kind: "Biome", lat: 24, lon: -48, want: "green",
              lore: [PH] },
            { id: "mountains", name: "Mountains", kind: "Biome", lat: 34, lon: 22, want: ["peak", "ice"],
              lore: [PH],
              conditions: [
                { n: "Frozen Ground",
                  txt: "Trigger: a character ends their turn without having moved. Effect: they freeze to the ground and become Immobilized until they pass a Hull check against 12, which they may attempt at the start of each of their turns.",
                  meta: "Region condition / Every character in the mountains" }
              ] },
            { id: "desert", name: "Desert", kind: "Biome", lat: -14, lon: 60, want: "desert",
              lore: [PH],
              conditions: [
                { n: "Scorching",
                  txt: "Any Heat gained within this region is doubled, no matter the source - weapons, systems, Overcharging or the environment alike.",
                  meta: "Region condition / Every character in the desert" }
              ] },
            { id: "dictis", name: "Dictis", kind: "City", lat: -6, lon: -12, want: "desert",
              lore: ["Where the squad's missions have been taking place. A short way from Vintatem, the larger city it sits in the shadow of.", PH] },
            { id: "vintatem", name: "Vintatem", kind: "City", lat: -13, lon: -3, want: "desert",
              lore: ["The larger city near Dictis.", PH] }
          ] },
        { id: "iii", name: "Invideis-III", orbit: 180, period: 5.9,  size: 6,   visited: false, phase: 1.7 },
        { id: "iv",  name: "Invideis-IV",  orbit: 250, period: 9.7,  size: 9,   visited: true,  phase: 5.2,
          ring: "#3FD8F0",
          palette: { sea: "#173E4A", land: ["#1F6B3A", "#246F3C", "#2E8B57", "#3B7A4B", "#4E6B3B"], cloud: "rgba(220,255,235,.14)" },
          dist: "0.31 ly from Invideis-II",
          stats: [["Development", "Sparse"], ["Fauna", "Large"], ["Trade", "Little offworld"], ["Settlements", "A few small cities"]],
          regions: [
            { id: "woods4", name: "Woods", kind: "Biome", lat: 12, lon: 8, want: "green",
              lore: ["A planet largely taken back by nature: little trade reaches it from other worlds, its fauna runs large, and only a few very small cities hold out against the green.",
                     "Within the woods stands Dendetz Zephyr's Outpost. Zephyr is a monster hunter working this planet on contract, and has been hiring the squad. See the personnel file on the main site: <a class=\"link\" href=\"./#personnel::Dendetz Zephyr\">Dendetz Zephyr</a>.",
                     PH] }
          ] },
        { id: "v",   name: "Invideis-V",   orbit: 360, period: 17.1, size: 12,  visited: false, phase: 2.6 },
        { id: "vi",  name: "Invideis-VI",  orbit: 490, period: 26.6, size: 10,  visited: false, phase: 4.4 },
        { id: "vii", name: "Invideis-VII", orbit: 640, period: 39.7, size: 5,   visited: false, phase: 0.3 }
      ]
    }
  ];
  var system = SYSTEMS[0];
  document.getElementById("sysname").textContent = system.name + " system · " + system.planets.length + " worlds";

  // ---- the chart -----------------------------------------------------------
  var chart = document.getElementById("chart"), cx = chart.getContext("2d");
  var starsC = document.getElementById("stars"), sx = starsC.getContext("2d");
  var W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var HOME = { yaw: -0.65, pitch: 0.62, dist: 1150 };
  var FOCUS = { pitch: 0.42 };
  // Close enough that perspective alone makes the followed world fill about
  // a fifth of the screen; every other world keeps its true relative size.
  function focusDist(p) { return FOCAL * p.size * 1.15 / (Math.min(W, H) * 0.19); }
  var cam = { yaw: HOME.yaw, pitch: HOME.pitch, dist: HOME.dist };
  var FOCAL = 780;
  var drifting = !reduced;
  var t0 = performance.now(), simT = 0;

  // What the camera looks at: the star, or a followed world, which it keeps
  // centred as the world moves along its orbit. A change of target eases
  // over from wherever the camera was looking. While a file is open the
  // target sits in the middle of the stage beside the rail rather than the
  // middle of the screen.
  var target = { x: 0, z: 0 };
  var focus = null;      // the followed world, if any
  var spin = 0;          // how far the followed world has turned
  var tween = null;      // { x, z, t }: where the target was when it last changed
  var focusScreen = null;
  function eye() {
    if (!current) return { x: W / 2, y: H / 2 };
    var rail = document.querySelector("#pv .rail");
    var rw = rail ? rail.getBoundingClientRect().width : 0;
    return { x: rw + (W - rw) * 0.5, y: H * 0.46 };
  }

  // Rotates a chart point by the camera and projects it. The orbit plane is
  // y = 0; the camera sits back along the view axis at cam.dist from the
  // target. Points that come round behind the camera get a small depth so
  // callers can skip them.
  function project(x, y, z) {
    x -= target.x; z -= target.z;
    var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    var x1 = x * cy - z * sy, z1 = x * sy + z * cy;
    var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    var y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
    var depth = cam.dist + z2;
    var s = FOCAL / Math.max(depth, 6);
    var e = eye();
    return { x: e.x + x1 * s, y: e.y + y2 * s, s: s, depth: depth };
  }

  function planetPos(p) {
    var a = p.phase + (drifting ? simT * (2 * Math.PI) / (p.period * 40) : 0);
    return { x: Math.cos(a) * p.orbit, z: Math.sin(a) * p.orbit, a: a };
  }

  // ---- procedural worlds -------------------------------------------------
  // Each world is shaded per pixel from layered 3D value noise sampled on the
  // sphere itself, so the surface wraps with no seam and no texture file.
  // A world's look is a handful of numbers: sea level, palette, ice, cloud
  // cover, atmosphere colour, and for a gas giant, banding. Rendered once per
  // size and cached; the chart draws the cached sprite turned toward the
  // star. An equirectangular image could later replace the noise for a
  // world with painted art - the projection below is the same either way.

  // 3D value noise with a cheap integer hash, trilinear blend, fBm on top.
  function hash3(x, y, z, seed) {
    var n = (x * 374761393 + y * 668265263 + z * 2147483647 + seed * 1013904223) | 0;
    n = (n ^ (n >>> 13)) * 1274126177 | 0;
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function noise3(x, y, z, seed) {
    var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    var xf = smooth(x - xi), yf = smooth(y - yi), zf = smooth(z - zi);
    var c000 = hash3(xi, yi, zi, seed),         c100 = hash3(xi + 1, yi, zi, seed);
    var c010 = hash3(xi, yi + 1, zi, seed),     c110 = hash3(xi + 1, yi + 1, zi, seed);
    var c001 = hash3(xi, yi, zi + 1, seed),     c101 = hash3(xi + 1, yi, zi + 1, seed);
    var c011 = hash3(xi, yi + 1, zi + 1, seed), c111 = hash3(xi + 1, yi + 1, zi + 1, seed);
    var x00 = c000 + (c100 - c000) * xf, x10 = c010 + (c110 - c010) * xf;
    var x01 = c001 + (c101 - c001) * xf, x11 = c011 + (c111 - c011) * xf;
    var y0 = x00 + (x10 - x00) * yf, y1 = x01 + (x11 - x01) * yf;
    return y0 + (y1 - y0) * zf;
  }
  function fbm(x, y, z, seed, oct, gain) {
    var v = 0, amp = 1, f = 1, norm = 0;
    for (var i = 0; i < oct; i++) {
      v += noise3(x * f, y * f, z * f, seed + i * 17) * amp;
      norm += amp; amp *= gain; f *= 2.03;
    }
    return v / norm;
  }
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

  // The look of each world. Unvisited worlds get a rocky or banded default
  // from their size so the chart still reads as a real system.
  var LOOKS = {
    ii: { seed: 21, sea: 0.50, scale: 3.3, deep: "#0B2A4E", shallow: "#1E6C8E", low: "#C9A96B", mid: "#B8925A",
          high: "#B9AB94", peak: "#E4E6E8", ice: 0.84, clouds: 0.34, atmo: "#6FD3FF", detail: 7, dry: true, oasis: true },
    iv: { seed: 47, sea: 0.40, scale: 2.8, deep: "#0A262B", shallow: "#155A4A", low: "#175E2E", mid: "#2A8452",

  // ---- the deep field ------------------------------------------------------
  // Painted once, larger than the screen, then slid a little with the camera
  // for parallax: a band of the galaxy running corner to corner, blue and
  // teal nebula with a violet patch, dust, thousands of faint stars thickest
  // along the band, and a few bright ones with a glow.
  var SKY = null, SKY2 = null, SKY_W = 0, SKY_H = 0, skyT0 = performance.now();
  function noise2(x, y, seed) { return noise3(x, y, 0.37, seed); }
  function fbm2(x, y, seed, oct) {
    var v = 0, amp = 1, f = 1, norm = 0;
    for (var i = 0; i < oct; i++) { v += noise2(x * f, y * f, seed + i * 13) * amp; norm += amp; amp *= .5; f *= 2.1; }
    return v / norm;
  }
  function paintSky() {
    SKY_W = Math.round(W * 1.25); SKY_H = Math.round(H * 1.25);
    SKY = document.createElement("canvas"); SKY.width = SKY_W; SKY.height = SKY_H;
    var g = SKY.getContext("2d");
    var seed = 4021;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    g.fillStyle = "#03060B"; g.fillRect(0, 0, SKY_W, SKY_H);

    // nebula at quarter resolution, scaled up so it blurs
    var nw = Math.max(64, SKY_W >> 2), nh = Math.max(64, SKY_H >> 2);
    var nc = document.createElement("canvas"); nc.width = nw; nc.height = nh;
    var ng = nc.getContext("2d"), img = ng.createImageData(nw, nh), d = img.data;
    var ang = -0.55, ca = Math.cos(ang), sa = Math.sin(ang);
    for (var y = 0; y < nh; y++) for (var x = 0; x < nw; x++) {
      var u = x / nw - .5, v = y / nh - .5;
      // distance from the band's centre line, in a rotated frame
      var along = u * ca - v * sa, across = u * sa + v * ca;
      var band = Math.exp(-(across * across) / 0.028);
      var n1 = fbm2(u * 3.2 + 9, v * 3.2 + 3, 11, 5);
      var n2 = fbm2(u * 6.5 - 2, v * 6.5 + 7, 29, 4);
      var dust = Math.pow(Math.max(0, n1 - .36) * 2.4, 1.3) * band;
      var wisp = Math.pow(Math.max(0, n2 - .44) * 2.6, 1.5) * (0.3 + 0.7 * band);
      var violet = Math.exp(-((u + .18) * (u + .18) + (v - .32) * (v - .32)) / 0.03) * Math.max(0, n2 - .3) * 2.2;
      var teal = Math.exp(-((u - .22) * (u - .22) + (v + .28) * (v + .28)) / 0.06) * Math.max(0, n1 - .34) * 2.6;
      var i = (y * nw + x) * 4;
      var r = 40 * dust + 90 * wisp + 150 * violet + 15 * teal;
      var gg = 85 * dust + 130 * wisp + 70 * violet + 170 * teal;
      var b = 170 * dust + 200 * wisp + 210 * violet + 190 * teal;
      d[i] = Math.min(255, r); d[i + 1] = Math.min(255, gg); d[i + 2] = Math.min(255, b);
      d[i + 3] = Math.min(255, (dust * 1.4 + wisp * .9 + violet * .9 + teal * .9) * 255);
    }
    ng.putImageData(img, 0, 0);
    g.imageSmoothingEnabled = true;
    g.drawImage(nc, 0, 0, SKY_W, SKY_H);

    // stars: thick along the band, thin elsewhere
    var count = Math.round(SKY_W * SKY_H / 380);
    for (var k = 0; k < count; k++) {
      var sx0 = rnd(), sy0 = rnd();
      var uu = sx0 - .5, vv = sy0 - .5, acr = uu * sa + vv * ca;
      var inBand = Math.exp(-(acr * acr) / 0.03);
      if (rnd() > 0.18 + 0.82 * inBand) continue;
      var m = rnd(), bright = m * m * m;
      var size = 0.6 + bright * 1.6;
      var tint = rnd();
      var col = tint < .12 ? "63,216,240" : tint < .2 ? "170,190,255" : tint < .24 ? "255,200,230" : "220,236,246";
      g.fillStyle = "rgba(" + col + "," + (0.25 + bright * .7) + ")";
      g.fillRect(sx0 * SKY_W, sy0 * SKY_H, size, size);
    }
    // the near layer: brighter stars and the glowing ones, on their own
    // canvas so they can slide faster than the nebula behind them
    SKY2 = document.createElement("canvas"); SKY2.width = Math.round(W * 2); SKY2.height = Math.round(H * 1.7);
    var g2 = SKY2.getContext("2d"), W2 = SKY2.width, H2 = SKY2.height;
    for (var k3 = 0; k3 < count / 4; k3++) {
      var m3 = rnd(), br3 = 0.5 + m3 * m3 * 1.4, tint3 = rnd();
      var col3 = tint3 < .15 ? "63,216,240" : tint3 < .25 ? "170,190,255" : "230,240,250";
      g2.fillStyle = "rgba(" + col3 + "," + (0.45 + m3 * .5) + ")";
      g2.fillRect(rnd() * W2, rnd() * H2, br3, br3);
    }
    g = g2;
    for (var b2 = 0; b2 < 22; b2++) {
      var bx = rnd() * W2, by = rnd() * H2, br = 6 + rnd() * 16;
      var tint2 = rnd();
      var col2 = tint2 < .5 ? "190,225,255" : tint2 < .8 ? "63,216,240" : "255,215,240";
      var glow = g.createRadialGradient(bx, by, 0, bx, by, br);
      glow.addColorStop(0, "rgba(" + col2 + ",.95)"); glow.addColorStop(.25, "rgba(" + col2 + ",.35)"); glow.addColorStop(1, "rgba(" + col2 + ",0)");
      g.fillStyle = glow; g.beginPath(); g.arc(bx, by, br, 0, Math.PI * 2); g.fill();
      g.fillStyle = "rgba(255,255,255,.95)"; g.fillRect(bx - .8, by - .8, 1.6, 1.6);
    }
  }

  function drawStars() {
    if (!SKY) paintSky();
    sx.clearRect(0, 0, W, H);
    // the painted field is 25% larger than the screen. The nebula slides a
    // little with the camera, the near stars more, and both creep slowly
    // on their own so the sky is never quite still.
    // Every offset stays inside the painted margin, so nothing ever wraps
    // or snaps: the camera terms are bounded sines and the drift is a slow
    // oscillation rather than a run.
    var t = (performance.now() - skyT0) / 1000;
    var mx = SKY_W - W, my = SKY_H - H;
    var px = Math.sin(cam.yaw), py = Math.sin(cam.pitch);
    var dx = Math.sin(t * 0.05), dy = Math.cos(t * 0.037);
    var ox = -(mx / 2 + px * mx * 0.3 + dx * mx * 0.15), oy = -(my / 2 + py * my * 0.3 + dy * my * 0.1);
    sx.drawImage(SKY, ox, oy);
    var mx2 = SKY2.width - W, my2 = SKY2.height - H;
    var ox2 = -(mx2 / 2 + px * mx2 * 0.35 + dx * mx2 * 0.1), oy2 = -(my2 / 2 + py * my2 * 0.35 + dy * my2 * 0.08);
    sx.drawImage(SKY2, ox2, oy2);
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    [chart, starsC].forEach(function (c) {
      c.width = W * DPR; c.height = H * DPR;
      c.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0);
    });
    SKY = null;
    drawStars(); drawChart();
  }
  window.addEventListener("resize", resize);

  // camera controls: drag to turn, wheel or pinch to zoom
  var drag = null, moved = 0;
  chart.addEventListener("pointerdown", function (e) {
    // dragging on the followed world spins the world; dragging anywhere
    // else turns the camera
    var onWorld = focus && hitAt(e.clientX, e.clientY) === focus;
    drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch, spin: onWorld, spin0: spin }; moved = 0;
    chart.setPointerCapture(e.pointerId); chart.className = "grabbing";
  });
  chart.addEventListener("pointermove", function (e) {
    if (drag) {
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      moved += Math.abs(dx) + Math.abs(dy);
      if (drag.spin) { spin = drag.spin0 + dx * 0.008; return; }
      cam.yaw = drag.yaw + dx * 0.006;
      // free to swing under the plane and look up through it
      cam.pitch = Math.max(-1.45, Math.min(1.45, drag.pitch + dy * 0.005));
      drawStars();
      return;
    }
    var h = hitAt(e.clientX, e.clientY);
    if (h !== hover) { hover = h; chart.className = h ? "over" : ""; }
    showTip(h, e.clientX, e.clientY);
  });
  chart.addEventListener("pointerup", function (e) {
    chart.className = hover ? "over" : "";
    var wasDrag = drag && moved > 6; drag = null;
    if (wasDrag) return;
    var h = hitAt(e.clientX, e.clientY);
    if (h && h.visited) openPlanet(h);
  });
  chart.addEventListener("pointerleave", function () { hover = null; showTip(null); });
  chart.addEventListener("wheel", function (e) {
    e.preventDefault();
    var lo = focus ? focusDist(focus) * 0.45 : 260, hi = focus ? focusDist(focus) * 8 : 2600;
    cam.dist = Math.max(lo, Math.min(hi, cam.dist * (e.deltaY > 0 ? 1.08 : 0.93)));
  }, { passive: false });

  function hitAt(x, y) {
    for (var i = hits.length - 1; i >= 0; i--) {
      var h = hits[i]; var d = Math.hypot(x - h.x, y - h.y);
      if (d <= h.r) return h.p;
    }
    return null;
  }
  var tip = document.getElementById("tip");
  function showTip(p, x, y) {
    if (!p) { tip.className = "tip"; return; }
    tip.innerHTML = p.name + "<span class=\"sub\">" + (p.visited ? "open file" : "not yet visited") + "</span>";
    tip.style.left = x + "px"; tip.style.top = y + "px";
    tip.className = "tip show";
  }

  document.getElementById("drift").addEventListener("click", function () {
    drifting = !drifting;
    this.setAttribute("aria-pressed", String(drifting));
    this.textContent = drifting ? "Orbits: moving" : "Orbits: held";
  });
  document.getElementById("reset").addEventListener("click", function () {
    if (current) document.getElementById("back").click(); else glide(HOME);
  });

  // eases the camera to a target over half a second
  var gliding = null;
  function glide(to, then) {
    if (reduced) { cam.yaw = to.yaw; cam.pitch = to.pitch; cam.dist = to.dist; if (then) then(); return; }
    gliding = { from: { yaw: cam.yaw, pitch: cam.pitch, dist: cam.dist }, to: to, t: performance.now(), then: then };
  }

  function frame(now) {
    var dt = (now - t0) / 1000; t0 = now;
    if (drifting) simT += dt;
    // follow the target: a world on its orbit, or the star
    var want = focus ? planetPos(focus) : { x: 0, z: 0 };
    if (tween) {
      var k2 = Math.min(1, (now - tween.t) / 700), e2 = 1 - Math.pow(1 - k2, 3);
      target.x = tween.x + (want.x - tween.x) * e2;
      target.z = tween.z + (want.z - tween.z) * e2;
      if (k2 >= 1) tween = null;
    } else { target.x = want.x; target.z = want.z; }
    // a followed world keeps turning unless the reader has hold of it
    if (focus && !(drag && drag.spin) && !reduced) spin += dt * 0.16;
    if (gliding) {
      var k = Math.min(1, (now - gliding.t) / 520), e = 1 - Math.pow(1 - k, 3);
      cam.yaw = gliding.from.yaw + (gliding.to.yaw - gliding.from.yaw) * e;
      cam.pitch = gliding.from.pitch + (gliding.to.pitch - gliding.from.pitch) * e;
      cam.dist = gliding.from.dist + (gliding.to.dist - gliding.from.dist) * e;
      if (k >= 1) { var fn = gliding.then; gliding = null; if (fn) fn(); }
      drawStars();
    }
    drawStars();
    drawChart();
    requestAnimationFrame(frame);
  }

  // ---- the planet view -----------------------------------------------------
  var pv = document.getElementById("pv");
  var current = null, region = null;

  // Follow a world: the camera eases over to it and closes in while the
  // chart keeps running underneath, so the other worlds go on moving round
  // it. From one file, picking another world just moves the camera across.
  function openPlanet(p) {
    tween = { x: target.x, z: target.z, t: performance.now() };
    focus = p;
    glide({ yaw: cam.yaw, pitch: FOCUS.pitch, dist: focusDist(p) });
    showPlanet(p);
  }
  function showPlanet(p) {
    current = p; region = null;
    pv.className = "on"; pv.setAttribute("aria-hidden", "false");
    document.body.className = "pv-on";
    document.getElementById("pvname").textContent = p.name;
    renderRail(); renderMarks(p); renderStats(p); renderChips(p);
    selectRegion(p.regions && p.regions[0] ? p.regions[0] : null);
  }
  document.getElementById("back").addEventListener("click", function () {
    pv.className = ""; pv.setAttribute("aria-hidden", "true"); current = null;
    document.body.className = "";
    tween = { x: target.x, z: target.z, t: performance.now() };
    focus = null; focusScreen = null;
    glide(HOME);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && current) document.getElementById("back").click();
  });

  function renderRail() {
    var box = document.getElementById("dests"); box.textContent = "";
    system.planets.forEach(function (p) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "dest" + (p.visited ? "" : " locked");
      if (p === current) b.setAttribute("aria-current", "true");
      var c = document.createElement("canvas"); c.width = 120; c.height = 120;
      drawSphere(c.getContext("2d"), 60, 60, 52, p, { x: -0.72, y: -0.40, z: 0.40 });
      b.appendChild(c);
      var t = document.createElement("div");
      var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = p.name; t.appendChild(nm);
      var d = document.createElement("div"); d.className = "dist"; d.textContent = p.visited ? p.dist : "no file"; t.appendChild(d);
      b.appendChild(t);
      var go = document.createElement("span"); go.className = "go"; go.textContent = "›"; b.appendChild(go);
      if (p.visited) b.addEventListener("click", function () { if (p !== current) openPlanet(p); });
      else b.disabled = true;
      box.appendChild(b);
    });
  }

  // Region markers ride on the followed world as the chart draws it: each
  // frame they are placed from the world's screen position and radius.
  var marks = document.getElementById("marks");
  function renderMarks(p) {
    marks.textContent = "";
    (p.regions || []).forEach(function (r) {
      var m = document.createElement("button");
      m.type = "button"; m.className = "mark"; m.title = r.name;
      m.addEventListener("click", function () { selectRegion(r); });
      m._region = r;
      marks.appendChild(m);
    });
    placeMarks();
  }
  function placeMarks() {
    if (!focusScreen) return;
    var fs = focusScreen;
    Array.prototype.forEach.call(marks.children, function (m) {
      var pt = surfacePoint(m._region.lat, m._region.lon, spin, fs);
      m.style.left = pt.x + "px";
      m.style.top = pt.y + "px";
      m.style.opacity = pt.front ? String(0.55 + 0.45 * Math.min(1, pt.z * 2)) : "0";
      m.style.pointerEvents = pt.front ? "auto" : "none";
    });
  }

  function renderStats(p) {
    var box = document.getElementById("pvstats"); box.textContent = "";
    (p.stats || []).forEach(function (s) {
      var d = document.createElement("div");
      var k = document.createElement("span"); k.className = "k"; k.textContent = s[0];
      var v = document.createElement("span"); v.className = "v"; v.textContent = s[1];
      d.appendChild(k); d.appendChild(v); box.appendChild(d);
    });
  }

  function renderChips(p) {
    var box = document.getElementById("pvchips"); box.textContent = "";
    (p.regions || []).forEach(function (r) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip";
      b.textContent = r.name;
      var k = document.createElement("span"); k.className = "kind"; k.textContent = r.kind; b.appendChild(k);
      b.addEventListener("click", function () { selectRegion(r); });
      b._region = r;
      box.appendChild(b);
    });
  }

  function selectRegion(r) {
    region = r;
    Array.prototype.forEach.call(document.querySelectorAll("#pvchips .chip"), function (b) {
      b.setAttribute("aria-pressed", String(b._region === r));
    });
    Array.prototype.forEach.call(marks.children, function (m) {
      m.className = "mark" + (m._region === r ? " on" : "");
    });
    var lore = document.getElementById("pvlore"); lore.textContent = "";
    if (!r) { lore.innerHTML = "<span class=\"k\">File</span><p class=\"ph\">Nothing on record for this world yet.</p>"; drawLead(); return; }
    var k = document.createElement("span"); k.className = "k"; k.textContent = r.kind; lore.appendChild(k);
    var h = document.createElement("h3"); h.textContent = r.name; lore.appendChild(h);
    (r.lore || []).forEach(function (para) {
      var pEl = document.createElement("p");
      if (para === PH) pEl.className = "ph";
      pEl.innerHTML = para;
      lore.appendChild(pEl);
    });
    if (r.conditions && r.conditions.length) {
      var c = document.createElement("div"); c.className = "cond";
      var ck = document.createElement("h4"); ck.textContent = "Mission conditions"; c.appendChild(ck);
      var ul = document.createElement("ul");
      r.conditions.forEach(function (f) {
        var li = document.createElement("li"); li.className = "entry";
        var nm = document.createElement("div"); nm.className = "name"; nm.textContent = f.n; li.appendChild(nm);
        if (f.txt) { var tx = document.createElement("div"); tx.className = "txt"; tx.innerHTML = markStatuses(f.txt); li.appendChild(tx); }
        if (f.meta) { var mt = document.createElement("div"); mt.className = "meta"; mt.textContent = f.meta; li.appendChild(mt); }
        ul.appendChild(li);
      });
      c.appendChild(ul); lore.appendChild(c);
    }
    requestAnimationFrame(drawLead);
  }

  // Picks status keywords out of rules text the way the dossiers do, so a
  // condition reads like one lifted off a scan.
  var STATUS_WORDS = { Immobilized: "bad", Stunned: "bad", Slowed: "bad", Jammed: "bad", Impaired: "bad",
                       Shredded: "bad", Exposed: "bad", Prone: "bad", Heat: "heat", Burn: "heat", Overcharging: "heat" };
  function markStatuses(text) {
    var safe = text.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    return safe.replace(/\b(Immobilized|Stunned|Slowed|Jammed|Impaired|Shredded|Exposed|Prone|Heat|Burn|Overcharging)\b/g, function (w) {
      return "<span class=\"status " + STATUS_WORDS[w] + "\">" + w + "</span>";
    });
  }

  // a leader line from the selected marker to the lore panel's top edge
  function drawLead() {
    var line = document.getElementById("leadline");
    var m = marks.querySelector(".mark.on"), lore = document.getElementById("pvlore");
    if (!m || !region || !focusScreen) { line.setAttribute("x1", 0); line.setAttribute("y1", 0); line.setAttribute("x2", 0); line.setAttribute("y2", 0); return; }
    var a = m.getBoundingClientRect(), b = lore.getBoundingClientRect();
    line.setAttribute("x1", a.left + a.width / 2); line.setAttribute("y1", a.top + a.height / 2);
    line.setAttribute("x2", Math.min(b.right - 24, Math.max(b.left + 24, a.left + a.width / 2)));
    line.setAttribute("y2", b.top);
  }
  window.addEventListener("resize", function () { if (current) requestAnimationFrame(drawLead); });

  // ---- boot ----------------------------------------------------------------
  system.planets.forEach(function (p) { if (p.visited) settleRegions(p); });
  resize();
  requestAnimationFrame(frame);
  // Bake ahead of need, one item per idle slice, so the first click on a
  // world and the first switch between them do not stall.
  (function prebake() {
    var jobs = [];
    system.planets.forEach(function (p) { jobs.push(function () { spriteFor(p, 96); lightMask(96, 0.25); }); });
    system.planets.forEach(function (p) { if (p.visited) jobs.push(function () { textureFor(p); spriteFor(p, 256); }); });
    [-1, -0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75, 1].forEach(function (lz) { jobs.push(function () { lightMask(96, lz); lightMask(256, lz); }); });
    function next() { var j = jobs.shift(); if (!j) return; j(); setTimeout(next, 30); }
    setTimeout(next, 400);
  })();

  // ?planet=ii opens a world straight away, for testing and for links
  var want = (location.search.match(/[?&]planet=([a-z0-9-]+)/i) || [])[1];
  if (want) {
    var p = system.planets.filter(function (q) { return q.id === want.toLowerCase() && q.visited; })[0];
    if (p) {
      focus = p; var pos = planetPos(p); target.x = pos.x; target.z = pos.z;
      cam.pitch = FOCUS.pitch; cam.dist = focusDist(p);
      showPlanet(p);
    }
  }
})();
</script>
</body>
</html>
