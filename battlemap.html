<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battle Map</title>
<meta name="description" content="A shared hex board for planning engagements: a battlefield, painted terrain, and tokens for every contact on file.">
<style>
  /* Palette and type, copied from the index so this page can stand alone. */
  :root {
    --ground: #05090E; --ground-2: #0A1520; --surface: #0B1822; --surface-alt: #10242F; --plate: #04080C;
    --ink: #D2ECF6; --ink-soft: #90B6C8; --ink-faint: #5B7F92;
    --rule: #1B3E4E; --accent: #3FD8F0; --accent-dim: #1E7E96; --brass: #F5B33C; --moss: #45E0A0;
    --steel: #7FA6BE; --violet: #A78BFA; --alert: #F2555A;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --cut: 10px;
    --chamfer: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font-family: var(--body); overflow: hidden; }
  button, input, select, textarea { font: inherit; }
  [hidden] { display: none !important; }

  /* ---------- the board ---------- */
  #board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #board.panning { cursor: grabbing; }
  #board.over { cursor: pointer; }
  #board.moving { cursor: grabbing; }
  #board.painting { cursor: crosshair; }

  .hud { position: fixed; z-index: 3; }
  .kicker { font-family: var(--mono); font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--accent); }
  .panel {
    background: rgba(11,24,34,.94); border: 1px solid var(--rule); clip-path: var(--chamfer);
    padding: .8rem .9rem; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .btn {
    font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    padding: .45rem .8rem; background: var(--surface); color: var(--ink-soft); border: 1px solid var(--rule);
    cursor: pointer; text-decoration: none; display: inline-block; line-height: 1.3;
  }
  .btn:hover, .btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent-dim); }
  .btn.danger:hover { color: var(--alert); border-color: var(--alert); }
  .btn:disabled { opacity: .45; cursor: default; }

  .hud-title { left: 1.2rem; top: 1rem; max-width: min(420px, calc(100vw - 2.4rem)); }
  .hud-title h1 { margin: .15rem 0 .5rem; font-size: 1.6rem; letter-spacing: .04em; text-shadow: 0 0 22px rgba(63,216,240,.35);
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  select.pick, .field input, .field select, .field textarea {
    background: var(--plate); color: var(--ink); border: 1px solid var(--rule); padding: .35rem .45rem;
    font-size: 12px; border-radius: 0; max-width: 100%;
  }
  select.pick { font-family: var(--mono); font-size: 11px; max-width: 220px; }

  /* the archivist's tools, down the left edge */
  .rail { left: 1.2rem; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: .35rem; }
  .rail .btn { width: 7.2rem; text-align: left; }

  /* side drawer: token, map settings, add token */
  .drawer { right: 1rem; top: 1rem; width: 300px; max-height: calc(100vh - 2rem); overflow-y: auto; }
  .drawer h2 { margin: .2rem 0 .7rem; font-size: 1.05rem; letter-spacing: .03em; }
  .drawer .head { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
  .field { display: flex; flex-direction: column; gap: .25rem; margin-bottom: .6rem; }
  .field > span { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
  .field textarea { min-height: 5.5rem; resize: vertical; font-family: var(--body); }
  .field input[type="color"] { padding: 0; height: 2rem; width: 3.2rem; }
  .field input[type="range"] { padding: 0; accent-color: var(--accent); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: .3rem; margin: .2rem 0 .8rem; }
  .stats div { background: var(--plate); border: 1px solid var(--rule); padding: .3rem .2rem; text-align: center; }
  .stats b { display: block; font-family: var(--mono); font-size: 13px; color: var(--ink); }
  .stats small { font-family: var(--mono); font-size: 8.5px; letter-spacing: .12em; color: var(--ink-faint); text-transform: uppercase; }
  .tokpic { width: 100%; height: 140px; object-fit: contain; background: var(--plate); border: 1px solid var(--rule); margin-bottom: .6rem; }
  .meta { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin: -.4rem 0 .7rem; }
  .note { font-size: 12px; color: var(--ink-faint); line-height: 1.5; margin: .2rem 0 .7rem; }

  .results { display: flex; flex-direction: column; gap: 2px; max-height: 46vh; overflow-y: auto; margin: .4rem 0 .7rem; }
  .result { display: flex; gap: .55rem; align-items: center; padding: .3rem .4rem; background: var(--plate);
            border: 1px solid transparent; cursor: pointer; color: var(--ink); text-align: left; width: 100%; }
  .result:hover { border-color: var(--accent-dim); }
  .result img, .result i { width: 34px; height: 34px; object-fit: cover; flex: 0 0 auto; background: var(--surface-alt); }
  .result span { display: flex; flex-direction: column; min-width: 0; }
  .result b { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result small { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; color: var(--ink-faint); text-transform: uppercase; }

  /* paint palette, along the bottom while painting */
  .paintbar { left: 50%; bottom: 1rem; transform: translateX(-50%); display: flex; gap: .4rem; align-items: center; flex-wrap: wrap;
              justify-content: center; max-width: calc(100vw - 2rem); }
  .swatch { display: flex; align-items: center; gap: .35rem; }
  .swatch i { width: 12px; height: 12px; display: inline-block; border: 1px solid rgba(255,255,255,.25); }

  /* roster of what is on the map */
  .roster { left: 1.2rem; bottom: 3.4rem; width: 230px; max-height: 38vh; overflow-y: auto; padding: .6rem .7rem; }
  .roster .result { padding: .2rem .3rem; }
  .roster .result img, .roster .result i { width: 24px; height: 24px; }

  .hud-foot { left: 1.2rem; bottom: 1rem; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .link { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint);
          display: flex; align-items: center; gap: .4rem; }
  .link i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); display: inline-block; }
  .link.live i { background: var(--moss); box-shadow: 0 0 8px var(--moss); }
  .link.poll i { background: var(--brass); }
  .link.down i { background: var(--alert); }
  .hud-help { right: 1.2rem; bottom: 1rem; text-align: right; font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
              text-transform: uppercase; color: var(--ink-faint); line-height: 1.8; pointer-events: none; }
  body.drawer-open .hud-help { display: none; }

  .tip { position: fixed; z-index: 6; pointer-events: none; max-width: 280px; padding: .5rem .65rem; background: rgba(4,8,12,.95);
         border: 1px solid var(--accent-dim); font-size: 12px; line-height: 1.45; display: none; }
  .tip b { display: block; font-size: 13px; }
  .tip small { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: .2rem; }
  .tip p { margin: .3rem 0 0; color: var(--ink-soft); white-space: pre-wrap; }

  .toast { position: fixed; z-index: 7; left: 50%; top: 1rem; transform: translateX(-50%); padding: .55rem .9rem;
           background: rgba(4,8,12,.96); border: 1px solid var(--alert); color: var(--ink); font-size: 12.5px; display: none;
           max-width: calc(100vw - 2rem); }
  .toast.ok { border-color: var(--moss); }

  .empty { left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; max-width: 360px; }
  .empty p { color: var(--ink-soft); font-size: 13px; line-height: 1.6; }

  @media (max-width: 720px) {
    .hud-title h1 { font-size: 1.2rem; }
    .rail { top: auto; bottom: 3.4rem; transform: none; flex-direction: row; flex-wrap: wrap; max-width: calc(100vw - 2.4rem); }
    .rail .btn { width: auto; }
    .drawer { left: 0; right: 0; top: auto; bottom: 0; width: 100%; max-height: 55vh; clip-path: none; }
    .roster { display: none; }
    .hud-help { display: none; }
    .paintbar { bottom: 6.5rem; }
  }

  /* ---------- crossing between pages ---------- */
  /* Same block as the main archive: a scanline wipe over a blur-and-swell on
     the way out, the reverse on arrival, with a sessionStorage flag between. */
  #warp {
    position: fixed; inset: 0; z-index: 400; pointer-events: none; opacity: 0;
    background: repeating-linear-gradient(0deg, rgba(63,216,240,.09) 0 1px, transparent 1px 3px), var(--ground);
  }
  #warp::after {
    content: ""; position: absolute; left: 0; right: 0; height: 22vh; top: -24vh;
    background: linear-gradient(180deg, transparent, rgba(63,216,240,.5), rgba(234,248,255,.95), rgba(63,216,240,.5), transparent);
  }
  html.leaving #warp { animation: warp-in .55s ease-in forwards; }
  html.leaving #warp::after { animation: warp-sweep .55s ease-in forwards; }
  html.leaving body { animation: warp-leave .55s ease-in forwards; }
  html.arriving #warp { animation: warp-out .6s ease-out forwards; }
  html.arriving #warp::after { animation: warp-sweep .6s ease-out forwards; }
  html.arriving body { animation: warp-arrive .6s ease-out forwards; }
  @keyframes warp-in { from { opacity: 0; } 60% { opacity: .85; } to { opacity: 1; } }
  @keyframes warp-out { from { opacity: 1; } 40% { opacity: .85; } to { opacity: 0; } }
  @keyframes warp-sweep { from { top: -24vh; } to { top: 112vh; } }
  @keyframes warp-leave { to { transform: scale(1.035); filter: blur(5px) brightness(.5); } }
  @keyframes warp-arrive { from { transform: scale(1.035); filter: blur(5px) brightness(.5); } to { transform: none; filter: none; } }
  @media (prefers-reduced-motion: reduce) { #warp { display: none; } html.leaving body, html.arriving body { animation: none; } }
</style>
</head>
<body>

<canvas id="board"></canvas>
<script>
// The crossing to and from the main archive; see the same block there.
(function () {
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var warp = document.createElement("div"); warp.id = "warp"; document.body.appendChild(warp);
  var came = false;
  try { came = sessionStorage.getItem("overseer.warp") === "1"; sessionStorage.removeItem("overseer.warp"); } catch (e) {}
  if (came && !reduced) {
    document.documentElement.classList.add("arriving");
    setTimeout(function () { document.documentElement.classList.remove("arriving"); }, 700);
  }
  window.warpTo = function (href) {
    if (reduced) { location.href = href; return; }
    try { sessionStorage.setItem("overseer.warp", "1"); } catch (e) {}
    document.documentElement.classList.add("leaving");
    setTimeout(function () { location.href = href; }, 560);
  };
})();
</script>

<div class="hud hud-title">
  <div class="kicker">Overseer &mdash; planning</div>
  <h1 id="mapname">Battle Map</h1>
  <div class="row">
    <select class="pick" id="mappick" aria-label="Battlefield"></select>
    <button class="btn" id="newmap" type="button" hidden>New map</button>
    <a class="btn" id="home" href="./">&larr; Archive</a>
  </div>
</div>

<div class="hud rail" id="rail" hidden>
  <button class="btn" type="button" data-tool="select" aria-pressed="true">Select</button>
  <button class="btn" type="button" data-tool="paint" aria-pressed="false">Paint</button>
  <button class="btn" type="button" data-tool="erase" aria-pressed="false">Erase</button>
  <button class="btn" type="button" id="addbtn">Add token</button>
  <button class="btn" type="button" id="setbtn">Map settings</button>
</div>

<div class="hud panel paintbar" id="paintbar" hidden></div>

<div class="hud panel drawer" id="drawer" hidden></div>

<div class="hud panel roster" id="roster" hidden></div>

<div class="hud hud-foot">
  <span class="link" id="link"><i></i><span id="linktext">Connecting</span></span>
  <button class="btn" id="fit" type="button">Fit map</button>
  <button class="btn" id="rosterbtn" type="button" aria-pressed="false">Roster</button>
  <button class="btn" id="labelsbtn" type="button" aria-pressed="true">Labels</button>
  <span class="link" id="who"></span>
</div>
<div class="hud hud-help">drag a token to move it &middot; R to turn<br>drag empty space to pan &middot; wheel to zoom</div>

<div class="hud panel empty" id="empty" hidden>
  <div class="kicker">No battlefield</div>
  <p id="emptytext">No battlefields have been laid out yet.</p>
</div>

<div class="tip" id="tip"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="filepick" accept="image/png,image/jpeg,image/webp" hidden>

      var pcs = m.payload && m.payload.response && m.payload.response.postgres_changes;
      if (rt.joined && pcs && pcs.length) rt.pg = true;
      if (rt.joined) reloadTokens();
      setLink(); return;
    }
    if (m.event === "system" && m.payload) {
      if (m.payload.extension === "postgres_changes") rt.pg = m.payload.status === "ok";
      setLink(); return;
    }
    if (m.event === "phx_error" || m.event === "phx_close") { rt.joined = false; rt.pg = false; setLink(); setTimeout(rtJoin, 2000); return; }
    if (m.event === "broadcast" && m.payload && m.payload.event === "drag") { remoteDrag(m.payload.payload || {}); return; }
    if (m.event === "postgres_changes" && m.payload && m.payload.data) { remoteRow(m.payload.data); }
  }
  function remoteDrag(p) {
    var t = tokens[p.id];
    if (!t || (drag && drag.id === p.id)) return;
    if (p.end) { t.remote = null; if (typeof p.q === "number") { t.q = p.q; t.r = p.r; } }
    else t.remote = { x: p.x, y: p.y, by: p.by || "Someone", at: Date.now() };
    dirty();
  }
  function remoteRow(d) {
    var rec = d.record || {}, old = d.old_record || {};
    if (d.table === "battlemaps") { applyMapRow(rec); return; }
    if (d.type === "DELETE") {
      if (tokens[old.id]) { delete tokens[old.id]; if (selected === old.id) select(null); sortTokens(); renderRoster(); dirty(); }
      return;
    }
    if (!map || rec.map_id !== map.id || (drag && drag.id === rec.id)) return;
    var t = tokens[rec.id];
    if (t) t.remote = null;
    adopt(rec); sortTokens(); renderRoster();
    if (selected === rec.id && drawerMode === "token" && !drawerBusy()) renderDrawer();
    dirty();
  }
  function sendDrag(id, x, y, end, q, r) {
    if (!rt.joined) return;
    var now = Date.now();
    if (!end && now - rt.lastDrag < 50) return;
    rt.lastDrag = now;
    var p = { id: id, x: x, y: y, by: (me && me.callsign) || "Someone", end: !!end };
    if (end) { p.q = q; p.r = r; }
    rtSend(rt.topic, "broadcast", { type: "broadcast", event: "drag", payload: p });
  }

  var polling = null;
  function setLink() {
    var el = document.getElementById("link"), tx = document.getElementById("linktext");
    var live = rt.joined && rt.pg;
    el.className = "link " + (live ? "live" : rt.open ? "poll" : "down");
    tx.textContent = live ? "Live" : rt.open ? "Syncing every 2s" : "Live link down, syncing every 2s";
    if (!live && !polling) polling = setInterval(poll, 2000);
    if (live && polling) { clearInterval(polling); polling = null; }
  }
  async function poll() {
    if (document.hidden || !map || drag) return;
    try {
      var id = map.id;
      var rows = await api("/rest/v1/battlemaps?select=*&id=eq." + id);
      if (rows && rows[0]) applyMapRow(rows[0]);
      await reloadTokens();
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden && map) { poll(); } });

  // ---- interface -------------------------------------------------------------
  var toastTimer = null;
  function toast(msg, ok) {
    var el = document.getElementById("toast");
    el.textContent = msg; el.className = "toast" + (ok ? " ok" : ""); el.style.display = "block";
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.style.display = "none"; }, 4200);
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function field(label, input) {
    var f = el("label", "field"); f.appendChild(el("span", null, label)); f.appendChild(input); return f;
  }
  function button(text, fn, cls) {
    var b = el("button", "btn" + (cls ? " " + cls : ""), text); b.type = "button"; b.addEventListener("click", fn); return b;
  }

  function renderPicker() {
    var pick = document.getElementById("mappick");
    pick.textContent = "";
    if (!maps.length) { var o = el("option", null, "No battlefields"); o.value = ""; pick.appendChild(o); }
    maps.forEach(function (m) { var o = el("option", null, m.name); o.value = m.id; pick.appendChild(o); });
    if (map) pick.value = map.id;
  }
  document.getElementById("mappick").addEventListener("change", function (e) { if (e.target.value) openMap(e.target.value); });
  document.getElementById("newmap").addEventListener("click", async function () {
    try {
      var rows = await authed("/rest/v1/battlemaps", { method: "POST", headers: { Prefer: "return=representation" },
        body: { name: "Untitled battlefield", grid: DEFAULT_GRID, paint: {} } });
      await loadMaps();
      await openMap(rows[0].id);
      drawerMode = "settings"; renderDrawer();
    } catch (err) { toast(err.message, false); }
  });

  function select(id) {
    selected = id;
    if (id) drawerMode = "token";
    else if (drawerMode === "token") drawerMode = null;
    renderDrawer(); dirty();
  }

  // tools
  document.querySelectorAll("#rail [data-tool]").forEach(function (b) {
    b.addEventListener("click", function () { setTool(b.getAttribute("data-tool")); });
  });
  function setTool(t) {
    tool = t;
    document.querySelectorAll("#rail [data-tool]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-tool") === t)); });
    document.getElementById("paintbar").hidden = t !== "paint";
    canvas.classList.toggle("painting", t !== "select");
    if (t === "paint") renderPaintbar();
  }
  function renderPaintbar() {
    var bar = document.getElementById("paintbar");
    bar.textContent = "";
    BRUSHES.forEach(function (b) {
      var btn = button("", function () { brush = Object.assign({ tag: brush.tag }, b); renderPaintbar(); });
      btn.className = "btn swatch";
      var i = el("i"); i.style.background = b.s ? b.c : rgba(b.c, 0.5);
      btn.appendChild(i); btn.appendChild(document.createTextNode(b.l));
      btn.setAttribute("aria-pressed", String(brush.c === b.c && brush.s === b.s));
      bar.appendChild(btn);
    });
    var col = el("input"); col.type = "color"; col.value = brush.c; col.title = "Custom colour";
    col.style.cssText = "width:2.2rem;height:1.9rem;padding:0;border:1px solid var(--rule);background:var(--plate)";
    col.addEventListener("input", function () { brush.c = col.value; });
    var solid = el("select", "pick");
    [["1", "Solid tile"], ["0", "Zone"]].forEach(function (o) { var op = el("option", null, o[1]); op.value = o[0]; solid.appendChild(op); });
    solid.value = String(brush.s);
    solid.addEventListener("change", function () { brush.s = +solid.value; });
    var tag = el("input", "pick"); tag.placeholder = "Hex label"; tag.maxLength = 12; tag.value = brush.tag || "";
    tag.style.cssText = "width:7rem;background:var(--plate);color:var(--ink);border:1px solid var(--rule);padding:.3rem .4rem;font-size:11px";
    tag.addEventListener("input", function () { brush.tag = tag.value.trim(); });
    bar.appendChild(col); bar.appendChild(solid); bar.appendChild(tag);
  }

  document.getElementById("addbtn").addEventListener("click", function () { drawerMode = drawerMode === "add" ? null : "add"; selected = null; renderDrawer(); dirty(); });
  document.getElementById("setbtn").addEventListener("click", function () { drawerMode = drawerMode === "settings" ? null : "settings"; selected = null; renderDrawer(); dirty(); });
  document.getElementById("fit").addEventListener("click", fitView);
  document.getElementById("home").addEventListener("click", function (e) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
    e.preventDefault(); window.warpTo("./");
  });
  document.getElementById("labelsbtn").addEventListener("click", function (e) {
    showLabels = !showLabels; e.currentTarget.setAttribute("aria-pressed", String(showLabels)); dirty();
  });
  document.getElementById("rosterbtn").addEventListener("click", function (e) {
    var r = document.getElementById("roster"); r.hidden = !r.hidden;
    e.currentTarget.setAttribute("aria-pressed", String(!r.hidden)); renderRoster();
  });

  function thumb(url) {
    if (!url) return el("i");
    var i = el("img"); i.src = url; i.alt = ""; i.loading = "lazy"; return i;
  }
  function renderRoster() {
    var r = document.getElementById("roster");
    if (r.hidden) return;
    r.textContent = "";
    r.appendChild(el("div", "kicker", "On the map (" + order.length + ")"));
    var list = el("div", "results");
    order.slice().reverse().forEach(function (t) {
      var b = el("button", "result"); b.type = "button";
      b.appendChild(thumb(tokenArt(t)));
      var s = el("span"); s.appendChild(el("b", null, t.label || t.contact || "Unnamed"));
      s.appendChild(el("small", null, t.kind === "prop" ? "Prop" : "Size " + t.size));
      b.appendChild(s);
      b.addEventListener("click", function () { select(t.id); cam.x = t.dx; cam.y = t.dy; dirty(); });
      list.appendChild(b);
    });
    if (!order.length) list.appendChild(el("p", "note", "Nothing placed yet."));
    r.appendChild(list);
  }

  // ---- drawer ----------------------------------------------------------------
  var drawerMode = null;
  var drawer = document.getElementById("drawer");
  function drawerBusy() { return drawer.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName); }
  function renderDrawer() {
    drawer.textContent = "";
    var mode = drawerMode;
    if (mode === "token" && !(selected && tokens[selected])) mode = null;
    if ((mode === "add" || mode === "settings") && !(archivist && map)) mode = null;
    drawer.hidden = !mode;
    document.body.classList.toggle("drawer-open", !!mode);
    if (mode === "token") tokenDrawer(tokens[selected]);
    if (mode === "add") addDrawer();
    if (mode === "settings") settingsDrawer();
  }
  function head(kick, title) {
    var h = el("div", "head"), l = el("div");
    l.appendChild(el("div", "kicker", kick)); l.appendChild(el("h2", null, title));
    h.appendChild(l);
    h.appendChild(button("Close", function () { drawerMode = null; selected = null; renderDrawer(); dirty(); }));
    drawer.appendChild(h);
  }

  function tokenDrawer(t) {
    var c = t.contact && BATTLE_CONTACTS[t.contact], edit = canMove(t) || (archivist && t.kind === "prop");
    head(t.kind === "prop" ? "Prop" : c ? "Contact token" : "Token", t.label || t.contact || "Unnamed");
    if (c) drawer.appendChild(el("div", "meta", [c.faction, c.tier, c.role].filter(Boolean).join(" / ")));
    var art = tokenArt(t);
    if (art) { var pic = el("img", "tokpic"); pic.src = art; pic.alt = ""; drawer.appendChild(pic); }
    if (c) {
      var st = el("div", "stats");
      [["HP", c.hp], ["Armor", c.armor], ["Speed", c.speed], ["Evade", c.evade], ["E-Def", c.edef]].forEach(function (p) {
        var d = el("div"); d.appendChild(el("b", null, p[1] === undefined || p[1] === null ? "-" : String(p[1]))); d.appendChild(el("small", null, p[0])); st.appendChild(d);
      });
      drawer.appendChild(st);
    }
    if (!edit) {
      if (t.description) drawer.appendChild(el("p", "note", t.description));
      if (!session) drawer.appendChild(el("p", "note", "Sign in on the main archive to move and edit tokens."));
      return;
    }
    var name = el("input"); name.value = t.label || ""; name.placeholder = t.contact || "Name"; name.maxLength = 80;
    name.addEventListener("input", function () { t.label = name.value; saveToken(t, { label: name.value }, 500); renderRoster(); dirty(); });
    drawer.appendChild(field("Name", name));

    var row = el("div", "pair");
    var col = el("input"); col.type = "color"; col.value = /^#[0-9a-f]{6}$/i.test(t.color) ? t.color : "#B8434A";
    col.addEventListener("input", function () { t.color = col.value; saveToken(t, { color: col.value }, 300); dirty(); });
    row.appendChild(field("Colour", col));
    var face = el("select");
    for (var a = 0; a < 360; a += (t.kind === "prop" ? 15 : 60)) { var o = el("option", null, a + "°"); o.value = a; face.appendChild(o); }
    if (!face.querySelector('option[value="' + (t.facing || 0) + '"]')) { var o2 = el("option", null, Math.round(t.facing) + "°"); o2.value = t.facing; face.appendChild(o2); }
    face.value = String(t.facing || 0);
    face.addEventListener("change", function () { t.facing = +face.value; saveToken(t, { facing: t.facing }); dirty(); });
    row.appendChild(field("Facing", face));
    drawer.appendChild(row);

    var desc = el("textarea"); desc.value = t.description || ""; desc.maxLength = 2000;
    desc.placeholder = "What this token stands for, its plan, anything the table should know.";
    desc.addEventListener("input", function () { t.description = desc.value; saveToken(t, { description: desc.value }, 600); });
    drawer.appendChild(field("Description", desc));

    if (!archivist) return;
    if (t.kind !== "prop") {
      var size = el("select");
      ["1/2", "1", "2", "3", "4"].forEach(function (s) { var o = el("option", null, "Size " + s); o.value = s; size.appendChild(o); });
      size.value = String(t.size || "1");
      size.addEventListener("change", function () { t.size = size.value; saveToken(t, { size: size.value }); dirty(); });
      drawer.appendChild(field("Size", size));
    } else {
      var sc = el("input"); sc.type = "range"; sc.min = "0.2"; sc.max = "20"; sc.step = "0.1"; sc.value = t.scale || 1;
      sc.addEventListener("input", function () { t.scale = +sc.value; saveToken(t, { scale: t.scale }, 400); dirty(); });
      drawer.appendChild(field("Scale (or drag the corner handle)", sc));
    }
    var acts = el("div", "row");
    acts.appendChild(button(t.image ? "Change picture" : "Set picture", function () {
      pickFile(async function (file) {
        try {
          toast("Uploading...", true);
          var blob = await fitImage(file, t.kind === "prop" ? 1600 : 512, t.kind === "prop" ? 700000 : 220000);
          var path = await uploadFile(blob);
          t.image = path; saveToken(t, { image: path }); renderDrawer(); dirty(); toast("Picture set.", true);
        } catch (err) { toast(err.message, false); }
      });
    }));
    if (t.image && t.contact) acts.appendChild(button("Dossier picture", function () { t.image = null; saveToken(t, { image: null }); renderDrawer(); dirty(); }));
    acts.appendChild(button("Duplicate", function () {
      addToken({ kind: t.kind, contact: t.contact, label: t.label, color: t.color, image: t.image, description: t.description, size: t.size, facing: t.facing, scale: t.scale });
    }));
    acts.appendChild(button("To front", function () {
      t.z = order.reduce(function (m, x) { return Math.max(m, x.z || 0); }, 0) + 1; sortTokens(); saveToken(t, { z: t.z }); dirty();
    }));
    acts.appendChild(button("Delete", function () { removeToken(t); }, "danger"));
    drawer.appendChild(acts);
  }

  function addDrawer() {
    head("Add to the map", "Add token");
    drawer.appendChild(el("p", "note", "Tokens land in the middle of the view. Drag them into place."));
    var acts = el("div", "row");
    acts.appendChild(button("Blank token", function () { addToken({ kind: "custom", label: "Token", color: "#3FA9D8", size: "1" }); }));
    acts.appendChild(button("Prop from picture", function () {
      pickFile(async function (file) {
        try {
          toast("Uploading...", true);
          var path = await uploadFile(await fitImage(file, 1600, 700000));
          addToken({ kind: "prop", label: file.name.replace(/\.[^.]+$/, "").slice(0, 80), color: "#5E6B72", size: "1", image: path, scale: 3 });
          toast("Prop placed.", true);
        } catch (err) { toast(err.message, false); }
      });
    }));
    drawer.appendChild(acts);
    var q = el("input"); q.placeholder = "Search contacts on file"; q.type = "search";
    var f = field("Contacts", q);
    f.style.marginTop = ".9rem";
    drawer.appendChild(f);
    var list = el("div", "results");
    drawer.appendChild(list);
    function fill() {
      list.textContent = "";
      var needle = q.value.trim().toLowerCase();
      var names = Object.keys(BATTLE_CONTACTS).filter(function (n) { return !needle || n.toLowerCase().indexOf(needle) !== -1; }).sort();
      names.slice(0, 150).forEach(function (n) {
        var c = BATTLE_CONTACTS[n], b = el("button", "result"); b.type = "button";
        b.appendChild(thumb(c.icon));
        var s = el("span"); s.appendChild(el("b", null, n));
        s.appendChild(el("small", null, [c.faction, c.tier, "Size " + (c.size || "1")].filter(Boolean).join(" / ")));
        b.appendChild(s);
        b.addEventListener("click", function () {
          var sz = String(c.size || "1"); if (!/^(1\/2|[1-4])$/.test(sz)) sz = sizeNum(sz) < 1 ? "1/2" : String(Math.round(sizeNum(sz)));
          addToken({ kind: "contact", contact: n, label: "", color: FACTION_COLORS[c.faction] || "#B8434A", size: sz });
        });
        list.appendChild(b);
      });
      if (!names.length) list.appendChild(el("p", "note", "No contact by that name."));
    }
    q.addEventListener("input", fill);
    fill();
    setTimeout(function () { q.focus(); }, 0);
  }

  function settingsDrawer() {
    var g = map.grid;
    head("Battlefield", "Map settings");
    var name = el("input"); name.value = map.name; name.maxLength = 80;
    name.addEventListener("input", function () {
      var v = name.value.trim(); if (!v) return;
      map.name = v; document.getElementById("mapname").textContent = v;
      var m = maps.filter(function (x) { return x.id === map.id; })[0]; if (m) { m.name = v; renderPicker(); }
      saveMap({ name: v }, 600);
    });
    drawer.appendChild(field("Name", name));

    var bg = el("div", "row");
    bg.appendChild(button(map.background ? "Change background" : "Set background", function () {
      pickFile(async function (file) {
        try {
          toast("Uploading the background...", true);
          var path = await uploadFile(await fitImage(file, 2400, 1000000));
          map.background = path; saveMap({ background: path }, 0); renderDrawer(); dirty(); toast("Background set.", true);
        } catch (err) { toast(err.message, false); }
      });
    }));
    if (map.background) bg.appendChild(button("Remove", function () { map.background = null; saveMap({ background: null }, 0); renderDrawer(); dirty(); }));
    drawer.appendChild(field("Background", bg));

    function slider(label, key, min, max, step) {
      var s = el("input"); s.type = "range"; s.min = min; s.max = max; s.step = step; s.value = g[key];
      s.addEventListener("input", function () { g[key] = +s.value; if (key === "size" || key === "cols" || key === "rows") areaPath = null; settle(); });
      return field(label, s);
    }
    function settle() { order.forEach(function (t) { var p = targetOf(t); t.dx = p.x; t.dy = p.y; }); saveMap({ grid: g }); dirty(); }
    var pair = el("div", "pair");
    pair.appendChild(slider("Background zoom", "bgz", 0.5, 3, 0.01));
    var orient = el("select");
    [["flat", "Flat-top"], ["pointy", "Pointy-top"]].forEach(function (o) { var op = el("option", null, o[1]); op.value = o[0]; orient.appendChild(op); });
    orient.value = g.orient;
    orient.addEventListener("change", function () { g.orient = orient.value; areaPath = null; settle(); fitView(); });
    pair.appendChild(field("Hexes", orient));
    drawer.appendChild(pair);
    var pair2 = el("div", "pair");
    pair2.appendChild(slider("Background left/right", "bgx", -50, 50, 0.5));
    pair2.appendChild(slider("Background up/down", "bgy", -50, 50, 0.5));
    drawer.appendChild(pair2);
    drawer.appendChild(slider("Hex size", "size", 16, 90, 0.5));
    var pair3 = el("div", "pair");
    function num(label, key) {
      var n = el("input"); n.type = "number"; n.min = 4; n.max = 150; n.value = g[key];
      n.addEventListener("change", function () { var v = Math.max(4, Math.min(150, Math.round(+n.value || g[key]))); n.value = v; g[key] = v; areaPath = null; settle(); });
      return field(label, n);
    }
    pair3.appendChild(num("Columns", "cols")); pair3.appendChild(num("Rows", "rows"));
    drawer.appendChild(pair3);
    var pair4 = el("div", "pair");
    var gc = el("input"); gc.type = "color"; gc.value = g.color;
    gc.addEventListener("input", function () { g.color = gc.value; settle(); });
    pair4.appendChild(field("Grid colour", gc));
    pair4.appendChild(slider("Grid strength", "alpha", 0, 1, 0.01));
    drawer.appendChild(pair4);

    var acts = el("div", "row");
    acts.appendChild(button("Clear paint", function () { map.paint = {}; savePaint(); dirty(); }));
    var armed = false, del = button("Delete map", async function () {
      if (!armed) { armed = true; del.textContent = "Click again to delete"; return; }
      try {
        await authed("/rest/v1/battlemaps?id=eq." + map.id, { method: "DELETE" });
        drawerMode = null; await loadMaps(); await openMap(maps[0] && maps[0].id); toast("Map deleted.", true);
      } catch (err) { toast(err.message, false); }
    }, "danger");
    acts.appendChild(del);
    drawer.appendChild(acts);
  }

  function renderWho() {
    var w = document.getElementById("who");
    w.textContent = !session ? "Signed out: watching only" : me ? (me.callsign || "Signed in") + (archivist ? " (Archivist)" : "") : "";
    document.getElementById("rail").hidden = !archivist;
    document.getElementById("newmap").hidden = !archivist;
  }

  // ---- boot --------------------------------------------------------------------
  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(loop);
  (async function () {
    loadSession();
    await loadMe();
    renderWho();
    loadContactRows();
    try { await loadMaps(); }
    catch (e) {
      document.getElementById("empty").hidden = false;
      document.getElementById("emptytext").textContent = "The battle maps are not set up on this archive yet.";
      setLink(); return;
    }
    var want = null;
    try { want = new URLSearchParams(location.search).get("map"); } catch (e) {}
    await openMap(want || (maps[0] && maps[0].id));
    rtConnect();
    setLink();
  })();
})();
</script>
</body>
</html>
